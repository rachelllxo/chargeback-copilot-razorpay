name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  end-to-end:
    name: Production image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t chargeback-copilot .
      - name: Run container
        run: |
          docker run -d --name cc -p 8080:8080 chargeback-copilot
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
      - name: Verify the app and API are served
        run: |
          set -euo pipefail
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8080/ | grep -q 'Chargeback Copilot'
          curl -sf http://localhost:8080/disputes/CB-2026-89101 | grep -q '<div id="root">'
          curl -sf http://localhost:8080/api/dashboard | grep -q 'Amount at risk'
          curl -sf http://localhost:8080/api/disputes/CB-2026-89101 | grep -q '"confidence":94'
      - name: Container logs
        if: always()
        run: docker logs cc
